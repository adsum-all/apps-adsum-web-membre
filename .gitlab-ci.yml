# Minimal pipeline for ADSUM. Delegates lint, test and build to the shared CI
# templates in sr-media-ai/adsum/deployment/ci-templates (Constitution audit and
# Node jobs). On develop and on version tags it also builds a versioned nginx
# image of the static site and pushes it to the registry (official Docker on the
# group runner). The live deploy is Cloudflare Pages; the image adds portability.
#
# The image build runs npm here (where the private registry token is available)
# to produce dist/, then the Dockerfile only copies that dist/, so no npm or
# private registry auth runs inside the image build.

include:
  - project: 'sr-media-ai/adsum/deployment/ci-templates'
    ref: main
    file: '/templates/node.yml'

.image:
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache nodejs npm >/dev/null
    - npm ci
    - npm run build
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

image:dev:
  extends: .image
  stage: build
  script:
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f deploy/Dockerfile
      -t "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
      -t "${CI_REGISTRY_IMAGE}/dev:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}/dev:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

image:prod:
  extends: .image
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="${VERSION}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f deploy/Dockerfile
      -t "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
      -t "${CI_REGISTRY_IMAGE}/prod:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
    - docker push "${CI_REGISTRY_IMAGE}/prod:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
